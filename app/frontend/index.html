
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        .hero {
            text-align: center;
            padding: 55px 20px;
            background: #dbeafe;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .products {
            padding: 40px 8%;
        }

        .products h2 {
            margin-bottom: 25px;
        }

        #product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .product-card h3 {
            margin-bottom: 12px;
        }

        .price {
            color: #166534;
            font-size: 21px;
            font-weight: bold;
            margin: 12px 0;
        }

        .stock {
            color: #555;
            margin-bottom: 15px;
        }

        .product-card button {
            background: #172554;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 22px;
            background: #172554;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ShopEase</h1>
        <span>Online Shopping Store</span>
    </header>

    <section class="hero">
        <h2>Welcome to ShopEase</h2>
        <p>Find your favourite products at great prices.</p>
    </section>

       <p id="cart-count">Cart: 0</p>
      <div id="cart-items"></div>
       <p id="cart-total">Total: ₹0</p>
    <section class="products">
        <h2>Our Products</h2>
        <div id="product-list">Loading products...</div>
    </section>

    <footer>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script>
        async function loadProducts() {
            const productList = document.getElementById("product-list");

            try {
                const response = await fetch("http://localhost:8082/api/products");

                if (!response.ok) {
                    throw new Error("Unable to fetch products");
                }

                const products = await response.json();

                productList.innerHTML = "";

                products.forEach(product => {
                    productList.innerHTML += `
                        <div class="product-card">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <p class="price">₹${product.price}</p>
                            <p class="stock">Stock: ${product.stock}</p>
                            <button onclick="addToCart('${product.name}',${product.price})">
                              Add to Cart   
                            </button>
                        </div>
                    `;
                });

            } catch (error) {
                productList.innerHTML = "Products load nahi ho paye. Please try again.";
                console.error(error);
            }
        }



let cart = [];


function addToCart(productName, price) {
    cart.push({ name: productName, price: price });
    updateCart();
    alert(productName + " added to cart!");
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCart();
}

function updateCart() {
    document.getElementById("cart-count").innerText =
        "Cart: " + cart.length;

    document.getElementById("cart-items").innerHTML =
        cart.map((item, i) =>
            `<p>${item.name} - ₹${item.price}
            <button onclick="removeFromCart(${i})">Remove</button></p>`
        ).join("");

    const total = cart.reduce((sum, item) => sum + item.price, 0);

    document.getElementById("cart-total").innerText =
        "Total: ₹" + total;
}


    loadProducts();
    </script>

</body>
</html>
